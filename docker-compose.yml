# Infra local do site do casamento.
# Producao: Postgres gerenciado + Cloudflare R2 (mesma API S3, so troca as env vars).
services:
  postgres:
    image: postgres:16-alpine
    container_name: casamento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: casamento
      POSTGRES_PASSWORD: casamento_dev
      POSTGRES_DB: casamento
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casamento -d casamento"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: casamento-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Necessario para o PUT presigned sair do browser direto pro storage.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Cria o bucket e libera leitura anonima (equivalente a um bucket publico no R2).
  minio-init:
    image: minio/mc:latest
    container_name: casamento-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/casamento-fotos &&
      mc anonymous set download local/casamento-fotos &&
      echo '>> bucket casamento-fotos pronto'
      "

volumes:
  postgres-data:
  minio-data:
